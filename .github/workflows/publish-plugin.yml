# Thin caller: publish Fake User Cleanup ZIP to Underdog Unlimited via shared reusable workflow.
#
# Environments are set by the reusable workflow via `target_environment` input.
# Caller jobs using `uses:` cannot have `environment:` directly (GitHub 422 error).
#
# Secrets (per environment):
#   UU_PUBLISH_TOKEN — same value as PLUGIN_PUBLISH_TOKEN on the Underdog server
#   UU_PUBLISH_URL — publish base URL (https only); a secret, not a variable, so it stays masked in logs

name: Publish plugin to Underdog

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish to staging (e.g. 2.7.20-rc3 or v2.7.20-rc3)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  guard:
    name: Guard production release
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.release.prerelease == false
    steps:
      - name: Ensure target is main or master
        run: |
          TARGET="${{ github.event.release.target_commitish }}"
          if [[ "$TARGET" != "main" && "$TARGET" != "master" ]]; then
            echo "::error::Production publishes must target main (got: $TARGET)"
            exit 1
          fi

  publish:
    name: Publish via shared workflow
    needs: [guard]
    if: always() && (needs.guard.result == 'success' || needs.guard.result == 'skipped')
    uses: legit-ninja/intersoccer-ci/.github/workflows/publish-plugin.yml@833aad022c993195ba99429f89cfff69d9a268e0 # intersoccer-ci branch ci/publish-url-secret-20261030 (pre-merge); bump to the merge SHA after that PR merges
    with:
      plugin_slug: fake-user-cleanup
      bootstrap_php: fake-user-cleanup.php
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
      changelog: ${{ github.event.release.body || '' }}
      target_environment: ${{ github.event_name == 'workflow_dispatch' && 'staging' || (github.event.release.prerelease && 'staging' || 'production') }}
    secrets:
      UU_PUBLISH_TOKEN: ${{ secrets.UU_PUBLISH_TOKEN }}
      UU_PUBLISH_URL: ${{ secrets.UU_PUBLISH_URL }}
